name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The companion client against the specification's vectors, and the page's own logic.
      - run: npm test
      # Types, then the static build Cloudflare makes.
      - run: npm run build
